name: Build Shine

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build and verify
        run: ./gradlew clean check build --no-daemon
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shine-fabric-1.20.1-${{ github.sha }}
          path: |
            build/libs/*.jar
            PORT_STATUS.md
          if-no-files-found: error

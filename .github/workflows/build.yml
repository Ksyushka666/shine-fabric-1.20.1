name: Build Shine

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: shine-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Select and bump patch version
        shell: bash
        run: |
          current=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/master" ]]; then
            IFS=. read -r major minor patch <<< "$current"
            next="${major}.${minor}.$((patch + 1))"
            sed -i "s/^mod_version=.*/mod_version=${next}/" gradle.properties
            version="$next"
          else
            version="$current"
          fi
          echo "MOD_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Building Shine version ${version}"
      - name: Build and verify
        run: ./gradlew clean check build --no-daemon
      - name: Generate checksums
        run: sha256sum build/libs/*.jar > SHA256SUMS.txt
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shine-fabric-1.20.1-${{ env.MOD_VERSION }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            SHA256SUMS.txt
            PORT_STATUS.md
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="shine-fabric-1.20.1-${MOD_VERSION}"
          tag="v${MOD_VERSION}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/libs/${artifact}.jar build/libs/${artifact}-sources.jar SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Shine Fabric 1.20.1 ${MOD_VERSION}" \
            --notes "Automated release created after a successful clean check build. Commit: ${GITHUB_SHA}." \
            --latest
      - name: Commit next version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          MOD_VERSION: ${{ env.MOD_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Multiple older runs may finish close together. Re-read origin and only
          # commit when the remote has not already recorded this version.
          git fetch origin master
          remote_version=$(git show origin/master:gradle.properties | sed -n 's/^mod_version=//p')
          if [[ "$remote_version" == "$MOD_VERSION" ]]; then
            echo "Version ${MOD_VERSION} is already recorded on origin; nothing to push."
            exit 0
          fi
          sed -i "s/^mod_version=.*/mod_version=${MOD_VERSION}/" gradle.properties
          git add gradle.properties
          git commit -m "chore: bump mod version to ${MOD_VERSION} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            git reset --hard origin/master
            remote_version=$(git show origin/master:gradle.properties | sed -n 's/^mod_version=//p')
            if [[ "$remote_version" == "$MOD_VERSION" ]]; then
              echo "Another run recorded version ${MOD_VERSION}; push is complete."
              exit 0
            fi
            sed -i "s/^mod_version=.*/mod_version=${MOD_VERSION}/" gradle.properties
            git add gradle.properties
            git commit -m "chore: bump mod version to ${MOD_VERSION} [skip ci]"
          done
          echo "Unable to push version bump after retries" >&2
          exit 1

plugins {
	id 'fabric-loom' version '1.10.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "isXander"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	mods {
		"shine" {
			sourceSet sourceSets.main
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional compile-time integrations; Maven coordinates keep CI portable.
	modCompileOnly "dev.isxander:yet-another-config-lib:3.6.6+1.20.1-fabric"
	modCompileOnly "com.terraformersmc:modmenu:7.2.2"
	modCompileOnly "maven.modrinth:sodium:mc1.20.1-0.5.11"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.register("portPipelineTest", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bloom.PortPipelineTest"
}

tasks.register("visualResourceAudit", Exec) {
	commandLine "python3", "tools/audit_visual_resources.py"
}

tasks.register("shaderOverlayAudit", Exec) {
	commandLine "python3", "tools/audit_shader_overlays.py"
}

tasks.register("postChainGraphAudit", Exec) {
	commandLine "python3", "tools/audit_post_chain_graph.py"
}

tasks.register("artifactParityAudit", Exec) {
	dependsOn "remapJar"
	commandLine "bash", "tools/audit_artifact_parity.sh"
}

tasks.register("cleanRuntimeAudit", Exec) {
	dependsOn "remapJar"
	commandLine "python3", "tools/audit_clean_runtime.py"
}

tasks.register("cleanClientAudit", Exec) {
	commandLine "python3", "tools/audit_clean_client.py"
}

tasks.register("finalMetadataAudit", Exec) {
	dependsOn "remapJar"
	commandLine "python3", "tools/audit_final_metadata.py"
}

tasks.register("renderCallbackAudit", Exec) {
	commandLine "python3", "tools/audit_render_callbacks.py"
}

tasks.register("sourceParityAudit", Exec) {
	dependsOn "remapSourcesJar"
	commandLine "python3", "tools/audit_source_parity.py"
}

tasks.register("packageCleanlinessAudit", Exec) {
	dependsOn "remapJar", "remapSourcesJar"
	commandLine "python3", "tools/audit_package_cleanliness.py"
}

tasks.register("mixinEnvironmentAudit", Exec) {
	commandLine "python3", "tools/audit_mixin_environment.py"
}

tasks.register("glslOutputAudit", Exec) {
	commandLine "python3", "tools/audit_glsl_outputs.py"
}

tasks.register("runtimeHardeningAudit", Exec) {
	commandLine "python3", "tools/audit_runtime_hardening.py"
}

tasks.register("runtimeCallbackAudit", Exec) {
	commandLine "python3", "tools/audit_runtime_callbacks.py"
}

tasks.register("configIntegrationAudit", Exec) {
	commandLine "python3", "tools/audit_config_integrations.py"
}

tasks.register("remappedArtifactAudit", Exec) {
	dependsOn "remapJar", "remapSourcesJar"
	commandLine "python3", "tools/audit_remapped_artifact.py"
}

tasks.register("resourceHookAudit", Exec) {
	commandLine "python3", "tools/audit_resource_hooks.py"
}

tasks.named("test") {
		enabled = false
}

tasks.named("check") {
	dependsOn "portPipelineTest", "visualResourceAudit", "shaderOverlayAudit", "postChainGraphAudit", "artifactParityAudit", "cleanRuntimeAudit", "cleanClientAudit", "finalMetadataAudit", "renderCallbackAudit", "sourceParityAudit", "packageCleanlinessAudit", "mixinEnvironmentAudit", "glslOutputAudit", "runtimeHardeningAudit", "runtimeCallbackAudit", "configIntegrationAudit", "remappedArtifactAudit", "resourceHookAudit"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE.md") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
